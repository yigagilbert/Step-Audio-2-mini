project:
  name: stepaudio2-luganda-english-bidirectional-lora-r64
  output_dir: /mnt/stepaudio_outputs/bidirectional/lora-r64
  processed_dir: /mnt/stepaudio_processed/luganda_english_bidirectional_v1
  seed: 42

model:
  name_or_path: stepfun-ai/Step-Audio-2-mini
  local_path: Step-Audio-2-mini
  trust_remote_code: true
  dtype: bfloat16
  gradient_checkpointing: true

dataset:
  name: yigagilbert/luganda-english-cleaned-v1-split
  token_env: HF_TOKEN
  required_columns:
    - audio_lug
    - audio_eng
    - text_lug
    - text_eng
    - id
    - src_dur_s
    - tgt_dur_s
    - dur_ratio
    - src_speech_ratio
    - tgt_speech_ratio
  splits:
    train: train
    validation: validation
    test: test
  filters:
    min_dur_ratio: 0.5
    max_dur_ratio: 2.0
    min_src_speech_ratio: 0.7
    min_tgt_speech_ratio: 0.7
    max_src_dur_s: 25.0
    max_tgt_dur_s: 30.0
  vad:
    enabled: true
    method: energy_trim
    top_db: 35
  audio:
    sample_rate: 16000
    save_resampled_wavs: false
  preprocessing:
    max_samples_per_split:
      train:
      validation:
      test:
    num_proc: 1
    target_token_batch_size: 1
    directions:
      - name: lug_to_eng
        source_audio: audio_lug
        target_audio: audio_eng
        source_text: text_lug
        target_text: text_eng
        source_language: Luganda
        target_language: English
        source_wav_suffix: lug
        target_wav_suffix: eng
      - name: eng_to_lug
        source_audio: audio_eng
        target_audio: audio_lug
        source_text: text_eng
        target_text: text_lug
        source_language: English
        target_language: Luganda
        source_wav_suffix: eng
        target_wav_suffix: lug

format:
  system_prompt: "You are a professional speech translation system. Listen to the source speech and answer with natural target-language speech."
  system_prompt_template: "You are a professional {source_language}-to-{target_language} speech translation system. Listen to the {source_language} speech and answer with natural {target_language} speech."
  target_format: text_then_audio
  max_target_audio_tokens: 1600
  max_sequence_length: 16384

lora:
  enabled: true
  r: 64
  alpha: 128
  dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  train_adapter: false
  train_audio_encoder: false

training:
  deepspeed: deepspeed_zero3.json
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 16
  num_train_epochs: 2
  max_steps: 9000
  learning_rate: 0.00005
  warmup_ratio: 0.05
  weight_decay: 0.01
  lr_scheduler_type: cosine
  logging_steps: 10
  eval_steps: 1000
  save_steps: 1000
  save_total_limit: 4
  max_grad_norm: 0.5
  bf16: true
  tf32: true
  dataloader_num_workers: 4
  report_to: wandb
  wandb_log_model: false
  debug_optimizer_state: false
  loss_guard_enabled: true
  loss_guard_min: 0.00000001
  loss_guard_max: 1000.0
  push_to_hub: false
  hub_model_id:

generation:
  max_new_tokens: 2048
  temperature: 0.7
  top_p: 0.9
  repetition_penalty: 1.05
  do_sample: true
  prompt_wav: Step-Audio2/assets/default_female.wav
